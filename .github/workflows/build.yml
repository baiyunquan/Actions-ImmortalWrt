name: Build JDCloud Luban ImmortalWrt

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luban-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: immortalwrt/immortalwrt
  SOURCE_REF: v25.12.1
  SOURCE_COMMIT: a3378d1a2c15beb2faf4b0bce9c00f07143efa29
  TZ: Asia/Shanghai

jobs:
  build:
    name: ramips/mt7621 jdcloud_re-cp-02
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build configuration and PassWall2
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate repository scripts
        run: |
          bash -n diy.sh scripts/*.sh
          sh -n files/etc/init.d/luban-extroot
          test "$(readlink files/etc/rc.d/S96luban-extroot)" = \
            "../init.d/luban-extroot"
          # Nikki remains in the repository, but is intentionally not compiled.
          # test -f package/nikki/nikki/Makefile
          # test -f package/nikki/mihomo-meta/Makefile
          # test -f package/nikki/luci-app-nikki/Makefile
          test -f package/passwall2/luci-app-passwall2/Makefile

      - name: Install build and image tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-pyelftools python3-setuptools rsync swig \
            unzip zlib1g-dev file wget curl libelf-dev device-tree-compiler \
            qemu-utils dosfstools e2fsprogs fdisk mtools pigz zstd fakeroot

      - name: Checkout ImmortalWrt 25.12.1 stable
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          path: ImmortalWrt
          fetch-depth: 1

      - name: Validate stable ImmortalWrt source
        working-directory: ImmortalWrt
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          grep -Fq 'VERSION_NUMBER),25.12.1)' include/version.mk

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            ImmortalWrt/dl
            !ImmortalWrt/dl/go-mod-cache
          key: luban-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default', '.config', '.gitmodules', 'package/passwall2/**') }}
          restore-keys: |
            luban-dl-${{ runner.os }}-

      - name: Prepare feeds, PassWall2, files, and configuration
        run: |
          cp feeds.conf.default ImmortalWrt/feeds.conf.default
          rm -rf ImmortalWrt/package/nikki ImmortalWrt/package/passwall2 \
            ImmortalWrt/files
          # Nikki source is retained but no longer copied into the build tree.
          # mkdir -p ImmortalWrt/package/nikki
          # rsync -a --exclude=.git package/nikki/ ImmortalWrt/package/nikki/
          mkdir -p ImmortalWrt/package/passwall2
          rsync -a --exclude=.git \
            package/passwall2/ ImmortalWrt/package/passwall2/
          cp -a files ImmortalWrt/files
          cp diy.sh ImmortalWrt/diy.sh
          chmod +x ImmortalWrt/diy.sh
          cd ImmortalWrt
          ./diy.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp "$GITHUB_WORKSPACE/.config" .config
          make defconfig

      - name: Validate resolved NOR configuration
        working-directory: ImmortalWrt
        run: |
          grep -E \
            '^(CONFIG_PACKAGE_(luci-app-passwall2|luci-i18n-passwall2-zh-cn|xray-core)=|# CONFIG_PACKAGE_(luci-app-passwall2|luci-i18n-passwall2-zh-cn|xray-core) is not set)' \
            .config || true
          grep -qx 'CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-cp-02=y' .config
          grep -qx 'CONFIG_TARGET_ROOTFS_SQUASHFS=y' .config
          grep -qx 'CONFIG_USE_APK=y' .config
          grep -qx 'CONFIG_PACKAGE_block-mount=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-fs-ext4=y' .config
          for package_name in \
            filebrowser luci-app-filebrowser luci-app-homeproxy \
            luci-app-tailscale-community luci-app-samba4 qbittorrent \
            luci-app-qbittorrent luci-app-passwall2; do
            grep -Eq "^CONFIG_PACKAGE_${package_name}=[my]$" .config
          done
          grep -qx 'CONFIG_PACKAGE_xray-core=m' .config
          grep -qx \
            'CONFIG_PACKAGE_luci-app-passwall2_Basic_Core_Xray=y' .config
          grep -qx \
            'CONFIG_PACKAGE_luci-app-passwall2_Nftables_Transparent_Proxy=y' \
            .config
          ! grep -Eq \
            '^CONFIG_PACKAGE_(yq|mihomo-meta|nikki|luci-app-nikki)=[my]$' \
            .config
          ! grep -q '^CONFIG_PACKAGE_luci-app-filebrowser-go=' .config
          test -f package/passwall2/luci-app-passwall2/Makefile

      - name: Download sources
        working-directory: ImmortalWrt
        run: |
          # Never reuse an extracted Go module cache. The files are cheap to
          # reconstruct and mixing toolchain versions can leave partial trees.
          rm -rf dl/go-mod-cache tmp/go-build
          if ! timeout --foreground 45m make download -j8; then
            echo "Initial parallel download failed or timed out; removing incomplete files and retrying."
            find dl -path dl/go-mod-cache -prune -o \
              -type f -size -1024c -print -exec rm -f {} +
            timeout --foreground 45m make download -j4
          fi
          # go-mod-cache contains many legitimate source files below 1 KiB.
          # Deleting them produces misleading "no required module provides"
          # failures when compiling YQ, Sing-box, Xray, and similar Go tools.
          find dl -path dl/go-mod-cache -prune -o \
            -type f -size -1024c -print -exec rm -f {} +

      - name: Build selected Go proxy cores serially
        working-directory: ImmortalWrt
        run: |
          make package/feeds/passwall_packages/sing-box/compile -j1 V=s
          make package/feeds/passwall_packages/xray-core/compile -j1 V=s

      - name: Build minimal NOR firmware and all APK modules
        working-directory: ImmortalWrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      - name: Record minimal build and source revisions
        run: |
          mkdir -p build-metadata
          cp ImmortalWrt/.config build-metadata/config.nor
          git -C ImmortalWrt rev-parse HEAD > build-metadata/IMMORTALWRT_COMMIT
          # git -C package/nikki rev-parse HEAD > build-metadata/NIKKI_COMMIT
          git -C package/passwall2 rev-parse HEAD \
            > build-metadata/PASSWALL2_COMMIT
          : > build-metadata/FEED_COMMITS
          for feed_dir in ImmortalWrt/feeds/*; do
            test -d "$feed_dir" || continue
            printf '%s %s\n' \
              "$(basename "$feed_dir")" \
              "$(git -C "$feed_dir" rev-parse HEAD)" \
              >> build-metadata/FEED_COMMITS
          done

      - name: Assemble pre-expanded extroot
        run: |
          chmod +x scripts/*.sh
          scripts/build-rich-rootfs.sh \
            "$GITHUB_WORKSPACE/ImmortalWrt" \
            "$GITHUB_WORKSPACE/extroot-stage" \
            "$GITHUB_WORKSPACE/build-metadata"

      - name: Build and validate release bundle
        run: |
          scripts/collect-artifacts.sh \
            "$GITHUB_WORKSPACE/ImmortalWrt" \
            "$GITHUB_WORKSPACE/extroot-stage" \
            "$GITHUB_WORKSPACE/build-metadata" \
            "$GITHUB_WORKSPACE/output"
          test -s output/JDCOS.bin
          test -s output/luban-sd-extroot.img.gz
          (cd output && sha256sum -c SHA256SUMS)

      - name: Upload two-image release artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdcloud-luban-immortalwrt-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          compression-level: 0
